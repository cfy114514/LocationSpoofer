name: Validate changes
on:
  push:
    branches: ["codex/sync-local-features"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:assembleScopedCoexist :core-geo:test :xposed:test :app-ui:testScopedDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-coexist-apks
          path: app/build/outputs/apk/scoped/coexist/*.apk
          if-no-files-found: error
